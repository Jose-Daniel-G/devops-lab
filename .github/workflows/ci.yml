name: DevOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validar sintaxis del Dockerfile con Hadolint (Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile
          failure-threshold: error
          
      - name: Construir la imagen Docker
        run: |
          docker build -t mi-app:${{ github.sha }} ./app

      - name: Probar ejecución de la imagen
        run: |
          docker run -d -p 3000:3000 --name test-app mi-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:3000 || exit 1