services:
  # Servicio 1: Nuestra App Node.js
  web:
    build: ./app
    container_name: devops_web_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres_db
      - DB_USER=postgres
      - DB_PASSWORD=secretpass
      - DB_NAME=devops_db
    depends_on:
      - postgres_db
    networks:
      - app-network

  # Servicio 2: Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: devops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata: